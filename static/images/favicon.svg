<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="14" fill="#1E293B" />

  <!-- Graduation Cap -->
  <g filter="url(#shadow)">
    <!-- Cap Skull/Base -->
    <path d="M 18 27 L 18 37 C 18 45 46 45 46 37 L 46 27 Z" fill="#1D4ED8" />
    <path d="M 21 29 L 21 36 C 21 42 43 42 43 36 L 43 29 Z" fill="#2563EB" opacity="0.6" />

    <!-- Diamond Mortarboard Top -->
    <polygon points="32,10 8,22 32,34 56,22" fill="url(#capGrad)" stroke="#60A5FA" stroke-width="0.8" />
    <polygon points="32,12 12,22 32,32 52,22" fill="#3B82F6" opacity="0.4" />

    <!-- Button on Cap -->
    <ellipse cx="32" cy="22" rx="3.5" ry="2.5" fill="#1E3A8A" />

    <!-- Golden Tassel hanging to the right -->
    <path d="M 32 22 Q 46 23 48 33" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="48" cy="34" r="2.5" fill="url(#goldGrad)" />
    <path d="M 46 34 L 50 42 L 46 42 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Rolled Diploma / Scroll in foreground -->
  <g transform="rotate(-20 28 44)" filter="url(#shadow)">
    <!-- Scroll body -->
    <rect x="14" y="42" width="34" height="11" rx="4" fill="url(#scrollGrad)" stroke="#CBD5E1" stroke-width="0.8" />
    <!-- Ribbon tie -->
    <rect x="29" y="41.5" width="4" height="12" rx="1.5" fill="#EF4444" />
    <!-- Ribbon tails -->
    <path d="M 31 53 L 29 59 L 33 58 L 35 59 Z" fill="#DC2626" />
  </g>
</svg>
