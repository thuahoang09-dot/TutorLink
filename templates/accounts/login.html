{% extends 'base.html' %}
{% load static %}

{% block title %}Đăng nhập – TutorLink{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5 border-0 shadow">
                <div class="text-center mb-4">
                    <div class="brand-badge mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    <h3 class="fw-bold">Đăng Nhập TutorLink</h3>
                    <p class="text-muted small">Chào mừng bạn quay trở lại nền tảng kết nối gia sư</p>
                </div>

                <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control border-start-0" placeholder="Nhập tên đăng nhập" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label mb-0" for="id_password">Mật khẩu</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control border-start-0" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-box-arrow-in-right"></i> Đăng Nhập
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Chưa có tài khoản? 
                        <a href="{% url 'accounts:register' %}" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
